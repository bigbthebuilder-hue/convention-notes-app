<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e9f1ef" />
  <meta name="description" content="Offline-first convention program note app." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Eternal Happiness Notes</title>
</head>
<body>
  <div id="appShell" class="app-shell">
    <div id="connectionPill" class="connection-status-only" aria-live="polite">Checking offline status...</div>

    <main id="screenHost" class="screen-host" aria-live="polite"></main>

    <nav class="bottom-tabs" aria-label="Main navigation">
      <button class="tab-btn active" data-tab="home" type="button">Home</button>
      <button class="tab-btn" data-tab="friday" type="button">Friday</button>
      <button class="tab-btn" data-tab="saturday" type="button">Saturday</button>
      <button class="tab-btn" data-tab="sunday" type="button">Sunday</button>
      <button class="tab-btn" data-tab="review" type="button">Review</button>
      <button class="tab-btn" data-tab="backup" type="button">Backup</button>
    </nav>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="./app.js" defer></script>
</body>
</html>
